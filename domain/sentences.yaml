# Small-talk sentence list for the SignToEnglish demo.
#
# STATUS: DRAFT, ASL NOT VERIFIED. Written 2026-11-16 by the planning model, which is not an ASL
# authority. The English sentences and the vocabulary are a proposal. Nothing here says how a
# sentence is signed.
#
# Before recording, for every sentence:
#   1. Find its ASL version from a reliable source (an ASL course or dictionary with video, or a
#      fluent signer). ASL has its own grammar and word order; do not sign the English word by word.
#   2. Write that version in `asl:` and where it came from in `source:`.
#   3. If the ASL version uses different signs than `signs:` lists, correct `signs:` and re-run the
#      coverage check. Some English words here may have no separate sign in ASL (for example "is",
#      "a", "to"), some concepts are one sign (for example THANK-YOU), and yes/no questions are
#      usually marked by facial expression rather than a sign.
#   4. Drop or replace any sentence the source cannot confirm.
#
# `signs:` is an unordered list of the concepts in the sentence, used only to check vocabulary
# coverage. It is not ASL word order, and it is never a model input or target.
#
# "Alex" is a placeholder: replace it with the name you will fingerspell, and keep it short.
#
# role: train        -> recorded for training, validation, and the seen-sentence test
# role: unseen_test  -> never used in training; tests translation of new sentences from known signs
#
# Coverage rule checked when this draft was generated: every sign in an unseen_test sentence
# appears in at least 3 training sentences.

