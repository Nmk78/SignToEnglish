  hidden_dim: 256
  label_smoothing: 0.2
  # The base model's training-time maximum; longer inputs are thinned to evenly spaced frames.
  max_frames: 256
  mt5_parameters: 582401280
  expected_prompt_ids: [89349, 11329, 17896, 1552, 288, 5413, 267, 1]
  # The reference's decoding settings. Step 2.3 may change them on validation.
  decode:
